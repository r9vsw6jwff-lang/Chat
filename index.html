<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный чат</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .red-glow-border { box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); }
        .red-glow-input:focus { box-shadow: 0 0 15px rgba(220, 38, 38, 0.3); }
        
        .chat-bg-watermark {
            position: relative;
            background-color: #09090b;
        }
        .chat-bg-watermark::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('https://files.catbox.moe/9q5n1t.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.08;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-white h-dvh flex items-center justify-center overflow-hidden font-sans">

    <!-- 1. ЭКРАН АВТОРИЗАЦИИ И СОЗДАНИЯ -->
    <div id="auth-screen" class="w-full h-full flex flex-col justify-center items-center p-4">
        <div class="w-full max-w-md bg-zinc-950 p-8 rounded-3xl red-glow-border text-center flex flex-col items-center">
            
            <div class="w-16 h-16 rounded-full bg-red-950/60 border border-red-600/50 flex items-center justify-center mb-6 shadow-lg">
                <i class="fa-solid fa-lock text-red-500 text-2xl"></i>
            </div>
            
            <h1 id="auth-title" class="text-2xl font-bold tracking-tight text-white mb-6">Секретный чат</h1>
            
            <form id="auth-form" class="w-full flex flex-col gap-4">
                <input type="text" id="nickname-input" placeholder="Ваш никнейм" required maxlength="20"
                    class="w-full bg-zinc-900 border border-zinc-700 text-white placeholder-zinc-500 text-sm rounded-2xl py-3 px-4 focus:outline-none focus:border-red-600 transition-all font-sans">
                
                <div class="relative w-full">
                    <input type="password" id="pass1-input" placeholder="Пароль комнаты" required
                        class="w-full bg-zinc-900 border border-zinc-700 text-white placeholder-zinc-500 text-sm rounded-2xl py-3 px-4 focus:outline-none focus:border-red-600 red-glow-input transition-all font-sans">
                </div>

                <div id="create-extra-fields" class="hidden flex flex-col gap-4">
                    <input type="password" id="pass2-input" placeholder="Повторите пароль"
                        class="w-full bg-zinc-900 border border-zinc-700 text-white placeholder-zinc-500 text-sm rounded-2xl py-3 px-4 focus:outline-none focus:border-red-600 red-glow-input transition-all font-sans">
                </div>
                
                <button type="submit" id="submit-btn"
                    class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white font-semibold py-3 rounded-2xl transition-all shadow-lg shadow-red-950 flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <span id="btn-text">Войти</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-zinc-900 w-full">
                <button type="button" id="toggle-mode-btn" onclick="toggleAuthMode()" class="text-sm text-zinc-400 hover:text-red-400 transition-colors cursor-pointer font-medium">
                    Создать новый чат (до 20 человек)
                </button>
            </div>

            <div id="auth-error" class="hidden mt-4 p-3 bg-red-950/80 border border-red-800 text-red-300 text-xs rounded-xl w-full">
            </div>
        </div>
    </div>

    <!-- 2. ГЛАВНОЕ ОКНО ЧАТА -->
    <div id="chat-screen" class="hidden w-full h-full flex flex-col bg-black max-w-4xl border-x border-zinc-900 shadow-2xl overflow-hidden relative">
        
        <div class="h-16 border-b border-zinc-900 px-3 md:px-6 flex items-center justify-between bg-zinc-950/90 backdrop-blur z-10">
            <div class="flex items-center gap-2 md:gap-3">
                <button id="admin-menu-btn" type="button" class="hidden text-[11px] bg-red-600 border border-red-500 text-white px-3 py-1.5 rounded-full hover:bg-red-700 transition-colors cursor-pointer font-semibold flex items-center gap-1.5 shadow-md shadow-red-950">
                    <i class="fa-solid fa-bars text-[10px]"></i> Меню
                </button>

                <div class="flex items-center gap-2 md:gap-3">
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <h2 id="chat-room-title" class="font-bold text-base text-white truncate max-w-[120px] sm:max-w-[180px]">Чат</h2>
                        </div>
                        <div id="timer-container-wrapper" class="flex items-center gap-1.5 text-[11px] font-mono text-red-500 font-semibold mt-0.5" title="Время до полного удаления всех сообщений">
                            <i class="fa-regular fa-clock text-[10px]"></i>
                            <span id="wipe-timer">06:00:00</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <span id="online-badge" class="hidden text-[11px] bg-emerald-950 border border-emerald-800 text-emerald-400 px-2.5 py-0.5 rounded-full items-center gap-1.5 font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span id="online-count">1</span>/20
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="leave-room-btn" type="button" title="Выйти из этого чата" 
                    class="hidden bg-zinc-900 hover:bg-red-950/60 hover:text-red-400 border border-zinc-800 text-zinc-300 text-xs px-3 py-2 rounded-full transition-all cursor-pointer flex items-center gap-1.5 font-medium">
                    <i class="fa-solid fa-arrow-right-from-bracket text-red-500 text-xs"></i>
                    <span class="hidden sm:inline">Выйти</span>
                </button>

                <button id="open-profile-btn" type="button" title="Мой Профиль" 
                    class="w-9 h-9 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded-full flex items-center justify-center transition-all cursor-pointer relative overflow-hidden">
                    <i id="header-profile-icon" class="fa-solid fa-user text-sm text-zinc-400"></i>
                    <img id="header-avatar-preview" src="" class="w-full h-full object-cover hidden">
                </button>
                
                <button id="logout-btn" type="button" title="Полный выход" class="w-9 h-9 bg-zinc-900 hover:bg-red-950/60 hover:text-red-400 border border-zinc-800 text-zinc-300 rounded-full flex items-center justify-center transition-all cursor-pointer">
                    <i class="fa-solid fa-power-off text-xs"></i>
                </button>
            </div>
        </div>

        <div id="admin-in-room-banner" class="hidden bg-red-950/80 border-b border-red-800/60 px-4 py-1.5 text-center text-[11px] text-red-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-crown text-red-400"></i>
            <span>Администратор чата сейчас в этой комнате</span>
        </div>

        <div id="messages-container" class="flex-1 p-4 md:p-6 overflow-y-auto flex flex-col gap-4 chat-bg-watermark">
        </div>

        <div id="voice-recording-bar" class="hidden bg-red-950/90 border-t border-red-900/50 px-4 py-2 flex items-center justify-between text-xs text-red-300 z-10">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                <span>Идет запись... <b id="recording-timer" class="font-mono ml-1">0:00</b></span>
            </div>
            <button id="cancel-voice-btn" type="button" class="text-zinc-400 hover:text-white px-3 py-1 rounded-full bg-zinc-900 cursor-pointer">Отмена</button>
        </div>

        <div class="p-3 md:p-4 bg-zinc-950 border-t border-zinc-900 z-10">
            <form id="message-form" class="flex items-center gap-2">
                <label title="Отправить фото" class="w-11 h-11 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded-full flex items-center justify-center transition-all cursor-pointer flex-shrink-0">
                    <i class="fa-solid fa-image text-base text-red-500"></i>
                    <input type="file" id="chat-photo-input" accept="image/*" class="hidden">
                </label>

                <div class="flex-1 relative">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Напишите сообщение..." 
                        class="w-full bg-zinc-900 border border-zinc-800 text-white placeholder-zinc-500 text-sm py-3 pl-4 pr-4 rounded-full focus:outline-none focus:border-red-600 red-glow-input transition-all">
                </div>

                <button type="button" id="voice-btn" title="Голосовое сообщение"
                    class="w-11 h-11 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded-full flex items-center justify-center transition-all flex-shrink-0 cursor-pointer">
                    <i class="fa-solid fa-microphone text-base"></i>
                </button>

                <button type="submit" id="send-btn" title="Отправить"
                    class="w-11 h-11 bg-red-600 hover:bg-red-700 text-white rounded-full flex items-center justify-center transition-all shadow-lg shadow-red-950/50 flex-shrink-0 cursor-pointer">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Меню Администратора -->
    <div id="admin-menu-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-5 sm:p-6 w-full max-w-lg relative shadow-2xl flex flex-col max-h-[85vh]">
            <button id="close-admin-menu-btn" type="button" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex items-center justify-center gap-2 mb-1">
                <i class="fa-solid fa-crown text-red-500"></i>
                <h3 class="text-lg font-bold text-white text-center">Панель Администратора</h3>
            </div>
            
            <div class="flex-1 overflow-y-auto border border-zinc-800 rounded-2xl p-3 bg-zinc-900/40 flex flex-col gap-2.5 mt-4" id="admin-users-list">
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Мой Профиль -->
    <div id="my-profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm relative shadow-2xl">
            <button id="close-my-profile-modal-btn" type="button" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold text-white mb-4 text-center">Мой Профиль</h3>
            
            <div class="flex flex-col items-center gap-4 mb-6">
                <img id="my-avatar-preview" src="" 
                     class="w-24 h-24 rounded-full object-cover border-2 border-red-600 shadow-lg">
                
                <label class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 text-xs py-2 px-4 rounded-xl border border-zinc-800 cursor-pointer transition-all flex items-center gap-2">
                    <i class="fa-solid fa-camera text-red-500"></i> Изменить фотографию
                    <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
                </label>
            </div>

            <div class="mb-6">
                <label class="text-xs text-zinc-400 mb-2 block">Никнейм:</label>
                <input type="text" id="profile-name-input" placeholder="Введите имя..." value="Пользователь" maxlength="20"
                       class="w-full bg-zinc-900 border border-zinc-800 text-sm text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-red-600 transition-all font-medium">
            </div>

            <button type="button" id="save-profile-btn" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm py-3 rounded-xl font-medium transition-all shadow-lg shadow-red-950 cursor-pointer">
                Сохранить настройки
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Профиль участника -->
    <div id="user-profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm text-center relative shadow-2xl">
            <button id="close-profile-modal-btn" type="button" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="profile-modal-avatar" src="" class="w-24 h-24 rounded-full object-cover border-2 border-red-600 mx-auto mb-4 shadow-lg">
            <div class="flex items-center justify-center gap-2 mb-1">
                <h3 id="profile-modal-name" class="text-xl font-bold text-white">...</h3>
                <span id="profile-modal-admin-badge" class="hidden text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-semibold">Админ чата</span>
            </div>
            <div id="profile-modal-status" class="text-xs mt-1">...</div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Просмотр Фото -->
    <div id="image-view-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md hidden cursor-pointer">
        <button id="close-image-modal-btn" type="button" class="absolute top-4 right-4 text-white text-2xl z-10 p-2 cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="modal-full-image" src="" class="max-w-full max-h-full rounded-2xl object-contain shadow-2xl red-glow-border">
    </div>

    <!-- Уведомление (Toast) -->
    <div id="toast-notification" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-red-950 border border-red-600 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl hidden transition-all">
        <span id="toast-text"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, deleteDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js";

        const ADMIN_LOGIN = "Admin";
        const ADMIN_PASSWORD = "846881";

        const SIX_HOURS_MS = 6 * 60 * 60 * 1000;
        const MAX_ROOM_USERS = 20;

        const firebaseConfig = {
            apiKey: "AIzaSyA5WJE3afisQ-Ue6w8EwLq1Bnz-Gjq5ICI",
            authDomain: "chat-14abe.firebaseapp.com",
            projectId: "chat-14abe",
            storageBucket: "chat-14abe.firebasestorage.app",
            messagingSenderId: "412240777047",
            appId: "1:412240777047:web:dcda1e2736c09e2777b812",
            measurementId: "G-JR38HQMKH3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Инициализация Cloud Messaging для пуш-уведомлений
        let messaging = null;
        try {
            messaging = getMessaging(app);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/firebase-messaging-sw.js')
                    .then((registration) => {
                        console.log('Service Worker зарегистрирован:', registration);
                    }).catch((err) => {
                        console.log('Ошибка регистрации Service Worker:', err);
                    });
            }
        } catch (e) {
            console.log('Messaging не поддерживается в этом браузере', e);
        }

        const USER_THEMES = [
            { bg: 'bg-red-950/70', border: 'border-red-600/50', text: 'text-red-400' },
            { bg: 'bg-blue-950/70', border: 'border-blue-600/50', text: 'text-blue-400' },
            { bg: 'bg-emerald-950/70', border: 'border-emerald-600/50', text: 'text-emerald-400' },
            { bg: 'bg-purple-950/70', border: 'border-purple-600/50', text: 'text-purple-400' },
            { bg: 'bg-amber-950/70', border: 'border-amber-600/50', text: 'text-amber-400' }
        ];

        let currentUser = null;
        let myProfile = { displayName: 'Участник', photoURL: '' };
        let onlineUsersMap = {};
        let currentRoomId = null;
        let roomResetAt = null;
        let timerInterval = null;
        let heartbeatInterval = null;
        let isAdmin = false;
        let isInAdminChatView = false;

        let unsubRoomCycle = null;
        let unsubOnlineUsers = null;
        let unsubMessages = null;
        let unsubGlobalUsers = null;

        function getDeviceId() {
            let deviceId = localStorage.getItem('chat_device_id_v20');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
                localStorage.setItem('chat_device_id_v20', deviceId);
            }
            return deviceId;
        }
        const currentDeviceId = getDeviceId();

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'давно';
            const date = new Date(timestamp);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (isToday) {
                return `сегодня в ${timeStr}`;
            }
            const dateStr = date.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: '2-digit' });
            return `${dateStr} в ${timeStr}`;
        }

        let isLoginMode = true;
        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            const authTitle = document.getElementById('auth-title');
            const btnText = document.getElementById('btn-text');
            const extraFields = document.getElementById('create-extra-fields');
            const toggleBtn = document.getElementById('toggle-mode-btn');
            const authError = document.getElementById('auth-error');

            authError.classList.add('hidden');
            if (isLoginMode) {
                authTitle.textContent = "Секретный чат";
                btnText.textContent = "Войти";
                extraFields.classList.add('hidden');
                toggleBtn.textContent = "Создать новый чат (до 20 человек)";
            } else {
                authTitle.textContent = "Создать свой чат";
                btnText.textContent = "Создать";
                extraFields.classList.remove('hidden');
                toggleBtn.textContent = "Уже есть пароль? Войти в чат";
            }
        };

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const authForm = document.getElementById('auth-form');
        const nicknameInput = document.getElementById('nickname-input');
        const pass1Input = document.getElementById('pass1-input');
        const pass2Input = document.getElementById('pass2-input');
        const authError = document.getElementById('auth-error');

        const openProfileBtn = document.getElementById('open-profile-btn');
        const myProfileModal = document.getElementById('my-profile-modal');
        const closeMyProfileModalBtn = document.getElementById('close-my-profile-modal-btn');
        const profileNameInput = document.getElementById('profile-name-input');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const myAvatarPreview = document.getElementById('my-avatar-preview');
        const headerAvatarPreview = document.getElementById('header-avatar-preview');
        const headerProfileIcon = document.getElementById('header-profile-icon');
        const saveProfileBtn = document.getElementById('save-profile-btn');

        const onlineBadge = document.getElementById('online-badge');
        const onlineCount = document.getElementById('online-count');
        const messagesContainer = document.getElementById('messages-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const wipeTimerEl = document.getElementById('wipe-timer');
        const timerContainerWrapper = document.getElementById('timer-container-wrapper');
        const chatRoomTitle = document.getElementById('chat-room-title');
        const adminInRoomBanner = document.getElementById('admin-in-room-banner');

        const voiceBtn = document.getElementById('voice-btn');
        const voiceRecordingBar = document.getElementById('voice-recording-bar');
        const recordingTimer = document.getElementById('recording-timer');
        const cancelVoiceBtn = document.getElementById('cancel-voice-btn');
        const chatPhotoInput = document.getElementById('chat-photo-input');
        const logoutBtn = document.getElementById('logout-btn');
        const leaveRoomBtn = document.getElementById('leave-room-btn');

        const imageViewModal = document.getElementById('image-view-modal');
        const modalFullImage = document.getElementById('modal-full-image');
        const userProfileModal = document.getElementById('user-profile-modal');

        const adminMenuBtn = document.getElementById('admin-menu-btn');
        const adminMenuModal = document.getElementById('admin-menu-modal');
        const closeAdminMenuBtn = document.getElementById('close-admin-menu-btn');
        const adminUsersList = document.getElementById('admin-users-list');

        let savedProfiles = {};
        try { savedProfiles = JSON.parse(localStorage.getItem('chat_profiles_v20') || '{}'); } catch(e){}
        if (savedProfiles[currentDeviceId]) {
            myProfile = savedProfiles[currentDeviceId];
            nicknameInput.value = myProfile.displayName;
        } else {
            myProfile.displayName = `Участник #${currentDeviceId.substring(4, 8)}`;
        }
        updateUIProfileData();

        function updateUIProfileData() {
            profileNameInput.value = myProfile.displayName;
            if (myProfile.photoURL) {
                myAvatarPreview.src = myProfile.photoURL;
                headerAvatarPreview.src = myProfile.photoURL;
                headerAvatarPreview.classList.remove('hidden');
                headerProfileIcon.classList.add('hidden');
            } else {
                headerProfileIcon.classList.remove('hidden');
                headerAvatarPreview.classList.add('hidden');
                
                const canvas = document.createElement('canvas');
                canvas.width = 100;
                canvas.height = 100;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#18181b';
                ctx.fillRect(0, 0, 100, 100);
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 50px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText((myProfile.displayName || 'Я')[0].toUpperCase(), 50, 50);
                myAvatarPreview.src = canvas.toDataURL();
            }
        }

        saveProfileBtn.addEventListener('click', async () => {
            const name = profileNameInput.value.trim();
            if (name) myProfile.displayName = name;
            updateUIProfileData();

            try { savedProfiles = JSON.parse(localStorage.getItem('chat_profiles_v20') || '{}'); } catch(e){}
            savedProfiles[currentDeviceId] = myProfile;
            localStorage.setItem('chat_profiles_v20', JSON.stringify(savedProfiles));

            if (currentUser && currentRoomId) {
                await updateOnlineStatus(true);
                await registerGlobalUser(true);
            }
            myProfileModal.classList.add('hidden');
            showToast('Профиль сохранен!');
        });

        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                showToast('Максимальный размер фото 5 МБ');
                return;
            }
            const reader = new FileReader();
            reader.onload = (evt) => {
                myProfile.photoURL = evt.target.result;
                myAvatarPreview.src = myProfile.photoURL;
            };
            reader.readAsDataURL(file);
        });

        openProfileBtn.addEventListener('click', () => myProfileModal.classList.remove('hidden'));
        closeMyProfileModalBtn.addEventListener('click', () => myProfileModal.classList.add('hidden'));

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const nickname = nicknameInput.value.trim();
            const pass1 = pass1Input.value.trim();
            const pass2 = pass2Input.value.trim();

            if (!nickname || !pass1) return showToast("Заполните никнейм и пароль");

            authError.classList.add('hidden');
            isAdmin = (nickname === ADMIN_LOGIN && pass1 === ADMIN_PASSWORD);

            try {
                const roomId = await sha256(pass1);
                const roomRef = doc(db, 'rooms', roomId);

                if (isAdmin) {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        const now = Date.now();
                        await setDoc(roomRef, {
                            createdAt: now,
                            resetAt: now + SIX_HOURS_MS,
                            creatorId: currentDeviceId,
                            maxUsers: MAX_ROOM_USERS
                        });
                    }
                } else if (!isLoginMode) {
                    if (pass1 !== pass2) {
                        authError.textContent = "Пароли не совпадают! Проверьте ввод.";
                        authError.classList.remove('hidden');
                        return;
                    }
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        authError.textContent = "Такой пароль уже занят. Придумайте другой или нажмите «Войти».";
                        authError.classList.remove('hidden');
                        return;
                    }
                    const now = Date.now();
                    await setDoc(roomRef, {
                        createdAt: now,
                        resetAt: now + SIX_HOURS_MS,
                        creatorId: currentDeviceId,
                        maxUsers: MAX_ROOM_USERS
                    });
                } else {
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) {
                        authError.textContent = "Чат с таким паролем не найден! Проверьте пароль или создайте новый.";
                        authError.classList.remove('hidden');
                        return;
                    }

                    const usersSnap = await getDocs(collection(db, 'rooms', roomId, 'users'));
                    const now = Date.now();
                    let activeCount = 0;
                    let alreadyInRoom = false;

                    usersSnap.forEach(u => {
                        const d = u.data();
                        if (d.deviceId === currentDeviceId) alreadyInRoom = true;
                        else if (d.isOnline && (now - (d.lastSeen || 0) < 35000)) activeCount++;
                    });

                    if (activeCount >= MAX_ROOM_USERS && !alreadyInRoom) {
                        authError.textContent = "В этом чате уже максимум участников (20 из 20).";
                        authError.classList.remove('hidden');
                        return;
                    }
                }

                currentRoomId = roomId;
                myProfile.displayName = nickname;
                updateUIProfileData();

                savedProfiles[currentDeviceId] = myProfile;
                localStorage.setItem('chat_profiles_v20', JSON.stringify(savedProfiles));
                localStorage.setItem('chat_is_admin', isAdmin ? 'true' : 'false');

                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                } else {
                    enterChatRoom(auth.currentUser);
                }
            } catch (err) {
                console.error(err);
                authError.textContent = "Ошибка подключения к базе данных.";
                authError.classList.remove('hidden');
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user && currentRoomId && !currentUser) {
                enterChatRoom(user);
            }
        });

        async function enterChatRoom(user) {
            currentUser = user;
            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');

            // Запрос разрешения на отправку уведомлений браузера
            if (messaging) {
                Notification.requestPermission().then(async (permission) => {
                    if (permission === 'granted') {
                        try {
                            const token = await getToken(messaging, { vapidKey: 'УКАЖИТЕ_ВАШ_VAPID_КЛЮЧ_ЕСЛИ_ЕСТЬ' });
                            console.log('FCM Token:', token);
                        } catch (err) {
                            console.log('Не удалось получить токен уведомлений', err);
                        }
                    }
                });
            }

            if (isAdmin) {
                adminMenuBtn.classList.remove('hidden');
                onlineBadge.classList.add('hidden');
                isInAdminChatView = false;
                showAdminMenuOnly();
            } else {
                adminMenuBtn.classList.add('hidden');
                onlineBadge.classList.remove('hidden');
                leaveRoomBtn.classList.add('hidden');
                if (timerContainerWrapper) timerContainerWrapper.style.display = 'flex';
                await switchRoom(currentRoomId, "Чат");
            }

            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                await updateOnlineStatus(true);
                await registerGlobalUser(true);
            }, 15000);

            window.addEventListener('beforeunload', () => {
                updateOnlineStatus(false);
                registerGlobalUser(false);
            });
        }

        function showAdminMenuOnly() {
            chatRoomTitle.textContent = "Панель Админа";
            if (timerContainerWrapper) timerContainerWrapper.style.display = 'none';
            leaveRoomBtn.classList.add('hidden');
            messagesContainer.innerHTML = '<div class="text-xs text-zinc-500 text-center py-12">Нажмите кнопку «Меню» слева вверху, чтобы выбрать пользователя и зайти в чат.</div>';
        }

        async function switchRoom(newRoomId, roomTitleText = "Чат") {
            if (currentRoomId && currentRoomId !== newRoomId) {
                await updateOnlineStatus(false);
            }

            currentRoomId = newRoomId;
            chatRoomTitle.textContent = roomTitleText;
            lastMessageCount = 0;

            if (unsubRoomCycle) unsubRoomCycle();
            if (unsubOnlineUsers) unsubOnlineUsers();
            if (unsubMessages) unsubMessages();
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            const roomRef = doc(db, 'rooms', currentRoomId);
            const snap = await getDoc(roomRef);
            if (!snap.exists()) {
                const now = Date.now();
                await setDoc(roomRef, {
                    createdAt: now,
                    resetAt: now + SIX_HOURS_MS,
                    creatorId: currentDeviceId,
                    maxUsers: MAX_ROOM_USERS
                });
            }

            await updateOnlineStatus(true);
            await registerGlobalUser(true);

            listenToRoomCycle();
            listenToOnlineUsers();
            listenToMessages();
        }

        async function registerGlobalUser(isOnline = true) {
            if (!currentUser) return;
            const globalUserRef = doc(db, 'global_users', currentDeviceId);
            try {
                await setDoc(globalUserRef, {
                    deviceId: currentDeviceId,
                    displayName: myProfile.displayName,
                    photoURL: myProfile.photoURL,
                    isOnline: isOnline,
                    lastActive: Date.now(),
                    currentRoomId: isAdmin && !isInAdminChatView ? null : (currentRoomId || null),
                    isAdmin: isAdmin
                }, { merge: true });
            } catch (err) {
                console.error("Ошибка сохранения глобального пользователя:", err);
            }
        }

        function listenToRoomCycle() {
            const roomRef = doc(db, 'rooms', currentRoomId);
            unsubRoomCycle = onSnapshot(roomRef, async (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                roomResetAt = data.resetAt || (Date.now() + SIX_HOURS_MS);

                if (!timerInterval && !isAdmin) {
                    startCountdownTimer();
                }
            });
        }

        function startCountdownTimer() {
            if (isAdmin) return;

            timerInterval = setInterval(async () => {
                if (!roomResetAt) return;
                const remaining = roomResetAt - Date.now();

                if (remaining <= 0) {
                    wipeTimerEl.textContent = "00:00:00";
                    await wipeAllMessagesAndResetTimer();
                } else {
                    const hrs = Math.floor(remaining / (1000 * 60 * 60));
                    const mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((remaining % (1000 * 60)) / 1000);
                    wipeTimerEl.textContent = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
            }, 1000);
        }

        let isWiping = false;
        async function wipeAllMessagesAndResetTimer() {
            if (isAdmin) return;
            if (isWiping || !currentRoomId) return;
            isWiping = true;
            try {
                const messagesCol = collection(db, 'rooms', currentRoomId, 'messages');
                const snap = await getDocs(messagesCol);
                const deletePromises = [];
                snap.forEach(d => deletePromises.push(deleteDoc(doc(db, 'rooms', currentRoomId, 'messages', d.id))));
                await Promise.all(deletePromises);

                const newResetAt = Date.now() + SIX_HOURS_MS;
                roomResetAt = newResetAt;
                await setDoc(doc(db, 'rooms', currentRoomId), { resetAt: newResetAt }, { merge: true });
                showToast("Время вышло! История чата полностью очищена.");
            } catch (e) {
                console.error(e);
            } finally {
                isWiping = false;
            }
        }

        async function updateOnlineStatus(isOnline) {
            if (!currentUser || !currentRoomId || (isAdmin && !isInAdminChatView)) return;
            const userRef = doc(db, 'rooms', currentRoomId, 'users', currentDeviceId);
            try {
                await setDoc(userRef, {
                    uid: currentUser.uid,
                    deviceId: currentDeviceId,
                    displayName: myProfile.displayName,
                    photoURL: myProfile.photoURL,
                    isOnline: isOnline,
                    lastSeen: Date.now(),
                    isAdmin: isAdmin
                }, { merge: true });
            } catch (err) {
                console.error(err);
            }
        }

        function listenToOnlineUsers() {
            if (!currentRoomId || isAdmin) return;
            const usersCol = collection(db, 'rooms', currentRoomId, 'users');
            unsubOnlineUsers = onSnapshot(usersCol, (snapshot) => {
                const now = Date.now();
                let activeCount = 0;
                let adminPresent = false;
                onlineUsersMap = {};

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    onlineUsersMap[data.deviceId || data.uid] = data;
                    const userIsOnline = data.isOnline && (now - (data.lastSeen || 0) < 35000);
                    if (userIsOnline) {
                        activeCount++;
                        if (data.isAdmin) adminPresent = true;
                    }
                });

                onlineCount.textContent = Math.max(1, activeCount);

                if (!isAdmin && adminPresent) {
                    adminInRoomBanner.classList.remove('hidden');
                } else {
                    adminInRoomBanner.classList.add('hidden');
                }
            });
        }

        adminMenuBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            adminMenuModal.classList.remove('hidden');
            loadAdminUsersList();
        });

        function loadAdminUsersList() {
            adminUsersList.innerHTML = '<div class="text-xs text-zinc-500 text-center py-6">Загрузка списка пользователей сайта...</div>';

            if (unsubGlobalUsers) unsubGlobalUsers();

            unsubGlobalUsers = onSnapshot(collection(db, 'global_users'), (globalUsersSnap) => {
                adminUsersList.innerHTML = '';

                if (globalUsersSnap.empty) {
                    adminUsersList.innerHTML = '<div class="text-xs text-zinc-500 text-center py-6">На сайте еще никто не зарегистрировался</div>';

                }

                const now = Date.now();
                const usersArr = [];
                globalUsersSnap.forEach(docSnap => usersArr.push(docSnap.data()));

                usersArr.sort((a, b) => {
                    const aOnline = a.isOnline && (now - (a.lastActive || 0) < 35000);
                    const bOnline = b.isOnline && (now - (b.lastActive || 0) < 35000);
                    if (aOnline !== bOnline) return bOnline ? 1 : -1;
                    return (b.lastActive || 0) - (a.lastActive || 0);
                });

                usersArr.forEach(u => {
                    const userIsOnline = u.isOnline && (now - (u.lastActive || 0) < 35000);
                    const isSelf = u.deviceId === currentDeviceId;

                    const statusHtml = userIsOnline

                               <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> в сети
                           </span>`
                        : `<span class="flex items-center gap-1.5 text-[11px] text-zinc-500">
                               <span class="w-2 h-2 rounded-full bg-zinc-600"></span> не в сети (${formatLastSeen(u.lastActive)})
                           </span>`;

                    const userRow = document.createElement('div');

                    userRow.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="relative flex-shrink-0">

                                     class="w-10 h-10 rounded-full object-cover border border-zinc-700"

                                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-zinc-900 ${userIsOnline ? 'bg-emerald-500' : 'bg-zinc-600'}"></span>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-sm font-semibold text-white truncate">${escapeHTML(u.displayName || 'Без имени')}</span>
                                    ${u.isAdmin ? '<span class="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">Админ</span>' : ''}
                                    ${isSelf ? '<span class="text-[9px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded">Вы</span>' : ''}
                                </div>
                                ${statusHtml}
                            </div>
                        </div>
                        ${!isSelf ? `
                        <button type="button" class="open-user-chat-btn flex-shrink-0 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all cursor-pointer shadow-md shadow-red-950/50">
                            <i class="fa-solid fa-comment-dots"></i>
                            <span>В чат</span>
                        </button>

                    `;

                    if (!isSelf) {

                        openChatBtn.addEventListener('click', async () => {
                            const targetRoomId = u.currentRoomId || `direct_${u.deviceId}`;

                            if (unsubGlobalUsers) unsubGlobalUsers();
                            
                            isInAdminChatView = true;
                            leaveRoomBtn.classList.remove('hidden');
                            await switchRoom(targetRoomId, `Чат: ${u.displayName || 'Пользователь'}`);
                            showToast(`Вы зашли в чат с ${u.displayName || 'пользователем'}`);

                    adminUsersList.appendChild(userRow);
                });
            }, (err) => {
                console.error(err);
                adminUsersList.innerHTML = '<div class="text-xs text-red-400 text-center py-4">Ошибка загрузки списка</div>';
            });
        }

        closeAdminMenuBtn.addEventListener('click', () => {
            adminMenuModal.classList.add('hidden');
            if (unsubGlobalUsers && !isAdmin) unsubGlobalUsers();
        });
        adminMenuModal.addEventListener('click', (e) => {
            if (e.target === adminMenuModal) {
                adminMenuModal.classList.add('hidden');
            }
        });

        function getUserTheme(uid) {
            if (uid === currentUser?.uid || uid === currentDeviceId) return USER_THEMES[0];
            let hash = 0;
            for (let i = 0; i < uid.length; i++) hash = uid.charCodeAt(i) + ((hash << 5) - hash);
            return USER_THEMES[(Math.abs(hash) % 4) + 1];
        }

        let lastMessageCount = 0;
        function listenToMessages() {
            if (!currentRoomId) return;
            const messagesCol = collection(db, 'rooms', currentRoomId, 'messages');

            unsubMessages = onSnapshot(messagesCol, async (snapshot) => {
                const now = Date.now();
                const docs = [];

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const createdAt = data.createdAt || 0;

                    if (!isAdmin && (now - createdAt > SIX_HOURS_MS)) {
                        deleteDoc(doc(db, 'rooms', currentRoomId, 'messages', docSnap.id)).catch(() => {});
                    } else {
                        docs.push({ id: docSnap.id, ...data });
                    }
                });

                docs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                if (!isAdmin && lastMessageCount > 0 && docs.length > lastMessageCount) {
                    const lastMsg = docs[docs.length - 1];
                    const isLastMsgMine = lastMsg.deviceId === currentDeviceId || lastMsg.uid === currentUser?.uid;

                    if (!isLastMsgMine) {
                        for (let i = docs.length - 2; i >= 0; i--) {
                            const prevMsg = docs[i];
                            const isPrevMsgMine = prevMsg.deviceId === currentDeviceId || prevMsg.uid === currentUser?.uid;
                            if (isPrevMsgMine) {
                                deleteDoc(doc(db, 'rooms', currentRoomId, 'messages', prevMsg.id)).catch(console.error);
                                break;
                            }
                        }
                    }
                }
                lastMessageCount = docs.length;

                messagesContainer.innerHTML = '';
                docs.forEach(msg => renderMessage(msg));
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function renderMessage(msg) {
            const isMe = msg.deviceId === currentDeviceId || msg.uid === currentUser?.uid;
            const msgIsAdmin = Boolean(msg.isAdmin);
            const theme = msgIsAdmin
                ? { bg: 'bg-red-950/90', border: 'border-red-500/70', text: 'text-red-400' }
                : getUserTheme(msg.deviceId || msg.uid);
            
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''}`;

            const formattedTime = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

            let contentHTML = '';
            if (msg.type === 'voice') {
                contentHTML = `
                    <div class="flex items-center gap-3 py-1">
                        <button type="button" class="voice-play-btn w-9 h-9 rounded-full ${isMe ? 'bg-red-600' : 'bg-zinc-800'} flex items-center justify-center text-white flex-shrink-0 hover:opacity-85 transition-opacity cursor-pointer">
                            <i class="fa-solid fa-play text-xs"></i>
                        </button>
                        <audio src="${msg.audioData}" preload="auto" class="hidden"></audio>
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-white">Голосовое</span>
                            <span class="text-[10px] text-zinc-400">Нажмите чтобы послушать</span>
                        </div>
                    </div>
                `;
            } else if (msg.type === 'image') {
                contentHTML = `
                    <div class="overflow-hidden rounded-xl cursor-pointer">
                        <img src="${msg.imageData}" class="chat-photo-thumbnail max-w-xs max-h-80 rounded-xl object-cover hover:opacity-90 transition-opacity" alt="Фотография">
                    </div>
                `;
            } else {
                contentHTML = `<p class="text-sm text-white break-words">${escapeHTML(msg.text)}</p>`;
            }

            const adminBadgeHTML = msgIsAdmin
                ? `<span class="inline-flex items-center gap-1 text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold shadow-sm">
                       <i class="fa-solid fa-crown text-[9px]"></i> Админ чата
                   </span>`
                : '';

            messageWrapper.innerHTML = `
                <img src="${msg.photoURL || 'https://placehold.co/100x100/18181b/ef4444?text=User'}" 
                     class="w-8 h-8 rounded-full object-cover border ${msgIsAdmin ? 'border-red-500' : 'border-zinc-800'} flex-shrink-0 mt-1 cursor-pointer hover:scale-105 transition-transform"
                     onerror="this.src='https://placehold.co/100x100/18181b/ef4444?text=User'">
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[75%]">
                    <div class="flex items-center gap-1.5 mb-1 px-1 ${isMe ? 'flex-row-reverse' : ''}">
                        <span class="msg-author-name text-[11px] font-semibold ${msgIsAdmin ? 'text-red-300' : 'text-zinc-400'} cursor-pointer hover:text-white">${escapeHTML(msg.displayName || 'Пользователь')}</span>
                        ${adminBadgeHTML}
                    </div>
                    <div class="${theme.bg} border ${theme.border} p-3 rounded-2xl ${isMe ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-md w-full">
                        ${contentHTML}
                        <div class="text-[9px] text-zinc-400 text-right mt-1">${formattedTime}</div>
                    </div>
                </div>
            `;

            if (msg.type === 'voice') {
                const playBtn = messageWrapper.querySelector('.voice-play-btn');
                const audioEl = messageWrapper.querySelector('audio');
                const icon = playBtn.querySelector('i');

                playBtn.addEventListener('click', () => {
                    if (audioEl.paused) {
                        document.querySelectorAll('audio').forEach(a => { if (a !== audioEl) { a.pause(); a.currentTime = 0; } });
                        audioEl.play().catch(e => console.error(e));
                        icon.className = 'fa-solid fa-pause text-xs';
                    } else {
                        audioEl.pause();
                        icon.className = 'fa-solid fa-play text-xs';
                    }
                });
                audioEl.addEventListener('ended', () => { icon.className = 'fa-solid fa-play text-xs'; });
            }

            if (msg.type === 'image') {
                messageWrapper.querySelector('.chat-photo-thumbnail').addEventListener('click', () => {
                    modalFullImage.src = msg.imageData;
                    imageViewModal.classList.remove('hidden');
                });
            }

            const openAction = () => {
                const userData = onlineUsersMap[msg.deviceId || msg.uid] || {
                    displayName: msg.displayName,
                    photoURL: msg.photoURL,
                    isOnline: false,
                    isAdmin: msgIsAdmin
                };
                openUserProfileModal(userData);
            };

            messageWrapper.querySelector('img').addEventListener('click', openAction);
            messageWrapper.querySelector('.msg-author-name').addEventListener('click', openAction);

            messagesContainer.appendChild(messageWrapper);
        }

        async function sendNewMessage(payload) {
            if (!currentRoomId) return;
            const messagesCol = collection(db, 'rooms', currentRoomId, 'messages');
            await addDoc(messagesCol, {
                uid: currentUser.uid,
                deviceId: currentDeviceId,
                displayName: myProfile.displayName,
                photoURL: myProfile.photoURL,
                isAdmin: isAdmin,
                createdAt: Date.now(),
                ...payload
            });
        }

        chatPhotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 30 * 1024 * 1024) {
                showToast('Максимальный размер фото 30 МБ');
                return;
            }
            const reader = new FileReader();
            reader.onload = async (evt) => {
                await sendNewMessage({ imageData: evt.target.result, type: 'image' });
            };
            reader.readAsDataURL(file);
            chatPhotoInput.value = '';
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            messageInput.value = '';
            await sendNewMessage({ text: text, type: 'text' });
        });

        voiceBtn.addEventListener('click', () => {
            if (isRecording) stopRecordingAndSend();
            else startRecording();
        });

        let mediaRecorder = null;
        let audioChunks = [];
        let recordingInterval = null;
        let recordingSeconds = 0;
        let isRecording = false;

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let options = {};
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus' };
                else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.start(100);
                isRecording = true;

                voiceRecordingBar.classList.remove('hidden');
                voiceBtn.classList.add('bg-red-600', 'text-white');
                voiceBtn.classList.remove('bg-zinc-900');

                recordingSeconds = 0;
                recordingTimer.textContent = "0:00";
                recordingInterval = setInterval(() => {
                    recordingSeconds++;
                    const mins = Math.floor(recordingSeconds / 60);
                    const secs = recordingSeconds % 60;
                    recordingTimer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            } catch (err) {
                showToast("Нет доступа к микрофону");
            }
        }

        function stopRecordingAndSend() {
            if (!mediaRecorder) return;
            mediaRecorder.onstop = async () => {
                const mime = mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: mime });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = async () => {
                    await sendNewMessage({ audioData: reader.result, type: 'voice' });
                };
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                resetVoiceUI();
            };
            mediaRecorder.stop();
        }

        cancelVoiceBtn.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.onstop = () => {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    resetVoiceUI();
                };
                mediaRecorder.stop();
            }
        });

        function resetVoiceUI() {
            isRecording = false;
            clearInterval(recordingInterval);
            voiceRecordingBar.classList.add('hidden');
            voiceBtn.classList.remove('bg-red-600', 'text-white');
            voiceBtn.classList.add('bg-zinc-900');
        }

        function openUserProfileModal(user) {
            document.getElementById('profile-modal-avatar').src = user.photoURL || 'https://placehold.co/100x100/18181b/ef4444?text=User';
            document.getElementById('profile-modal-name').textContent = user.displayName || 'Пользователь';
            
            const adminBadge = document.getElementById('profile-modal-admin-badge');
            if (user.isAdmin) {
                adminBadge.classList.remove('hidden');
            } else {
                adminBadge.classList.add('hidden');
            }

            const statusEl = document.getElementById('profile-modal-status');
            const isOnline = user.isOnline && (Date.now() - (user.lastSeen || 0) < 35000);

            if (isOnline) {
                statusEl.className = 'text-xs text-emerald-400 font-medium mt-1';
                statusEl.textContent = 'в сети';
            } else {
                statusEl.className = 'text-xs text-zinc-500 mt-1';
                statusEl.textContent = user.lastSeen ? `не в сети (был ${formatLastSeen(user.lastSeen)})` : 'не в сети';
            }

            userProfileModal.classList.remove('hidden');
        }

        leaveRoomBtn.addEventListener('click', async () => {
            if (isAdmin) {
                if (unsubMessages) unsubMessages();
                if (unsubOnlineUsers) unsubOnlineUsers();
                if (timerInterval) clearInterval(timerInterval);
                isInAdminChatView = false;
                leaveRoomBtn.classList.add('hidden');
                showAdminMenuOnly();
                showToast('Вы вышли из чата пользователя');
            } else {
                clearInterval(heartbeatInterval);
                clearInterval(timerInterval);
                await updateOnlineStatus(false);
                await registerGlobalUser(false);
                window.location.href = window.location.origin + window.location.pathname;
            }
        });

        document.getElementById('close-profile-modal-btn').addEventListener('click', () => userProfileModal.classList.add('hidden'));
        imageViewModal.addEventListener('click', () => imageViewModal.classList.add('hidden'));
        document.getElementById('close-image-modal-btn').addEventListener('click', () => imageViewModal.classList.add('hidden'));

        logoutBtn.addEventListener('click', async () => {
            clearInterval(heartbeatInterval);
            clearInterval(timerInterval);
            localStorage.removeItem('chat_is_admin');
            await updateOnlineStatus(false);
            await registerGlobalUser(false);
            window.location.href = window.location.origin + window.location.pathname;
        });

        function escapeHTML(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
